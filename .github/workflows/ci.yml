name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Resolve dependencies
        run: go mod tidy
      - name: Commit dependency lockfiles (PR #10 only)
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/010-svg-rasterization'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum
          if ! git diff --cached --quiet; then
            git commit -m "Lock SVG rasterizer dependencies"
            git push origin HEAD:feat/010-svg-rasterization
          fi
      - name: Format
        run: |
          gofmt -l cmd internal
          test -z "$(gofmt -l cmd internal)"
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./cmd/kaqen
